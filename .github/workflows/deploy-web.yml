name: Deploy web app

# Builds apps/web and publishes it to GitHub Pages:
# https://giozuki.github.io/Nodoteca/

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/core/**"
      - "package-lock.json"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build
        run: npm run build
        env:
          NODOTECA_BASE: /${{ github.event.repository.name }}/
          # Public by design (they ship inside the app); data is protected by RLS.
          # Forks: set the repository variables SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY.
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://wutylntjycqyfzectals.supabase.co' }}
          # The email template includes {{ .Token }} (custom SMTP is set up).
          VITE_AUTH_CODE: "true"
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_YXduBXAMQEmCSf-oU37U7Q_GjAy_Jxn' }}
      - name: SPA fallback
        # GitHub Pages has no rewrites: serve the app for every unknown path (/c/…, /share…).
        run: cp apps/web/dist/index.html apps/web/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
