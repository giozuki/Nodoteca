<!doctype html>
<html><head><meta charset="UTF-8" /><title>Nodoteca showcase</title>
<style>
  html, body { margin: 0; }
  body {
    width: 1720px; height: 960px; position: relative; overflow: hidden;
    background:
      radial-gradient(60% 70% at 72% 55%, rgb(255 106 53 / 12%), transparent 70%),
      radial-gradient(circle at 2px 2px, rgb(255 255 255 / 7%) 1px, transparent 1.5px) 0 0 / 24px 24px,
      #0c0c0a;
    font-family: system-ui, sans-serif;
  }
  .browser {
    position: absolute; left: 56px; top: 64px; width: 1240px; border-radius: 16px; overflow: hidden;
    background: #161613; border: 1px solid #3b3933;
    box-shadow: 0 2px 6px rgb(0 0 0 / 40%), 0 40px 90px -20px rgb(0 0 0 / 80%);
  }
  .bar { height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 16px; background: #1f1e1a; border-bottom: 1px solid #2a2924; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #3b3933; }
  .url { margin: 0 auto; transform: translateX(-30px); width: 420px; height: 26px; border-radius: 8px; background: #161613; color: #a19c90; font-size: 13px; display: grid; place-items: center; }
  .viewport { width: 1240px; height: 775px; overflow: hidden; }
  .viewport iframe { width: 1440px; height: 900px; border: 0; transform: scale(0.86111); transform-origin: 0 0; }
  .phone {
    position: absolute; right: 56px; top: 104px; box-sizing: border-box; width: 381px; height: 799px; padding: 11px; border-radius: 58px;
    background: #050504; border: 1px solid #3b3933;
    box-shadow: 0 2px 6px rgb(0 0 0 / 50%), 0 50px 100px -20px rgb(0 0 0 / 90%), inset 0 0 0 2px #24231f;
  }
  .screen { width: 359px; height: 777px; border-radius: 47px; overflow: hidden; position: relative; background: #ece8df; }
  .status { height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 4px 30px 0 34px; box-sizing: border-box; font: 600 15px/1 system-ui, sans-serif; color: #17160f; background: #fbfaf6; }
  .status svg { display: block; }
  .screen iframe { display: block; width: 390px; height: 794px; border: 0; transform: scale(0.92051); transform-origin: 0 0; }
  .island { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 104px; height: 30px; border-radius: 20px; background: #050504; z-index: 2; }
</style></head>
<body>
  <div class="browser">
    <div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="url">giozuki.github.io/Nodoteca</span></div>
    <div class="viewport"><iframe id="desk"></iframe></div>
  </div>
  <div class="phone"><div class="screen"><div class="island"></div>
    <div class="status"><span>9:41</span>
      <svg width="64" height="12" viewBox="0 0 64 12"><g fill="#17160f">
        <rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="6" width="3" height="6" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/>
        <path d="M30 3.5a9 9 0 0 1 11 0l-1.4 1.6a7 7 0 0 0-8.2 0zM32.6 6.6a5 5 0 0 1 5.8 0L35.5 10z"/>
        <rect x="44" y="1" width="17" height="10" rx="3" fill="none" stroke="#17160f" stroke-opacity=".45"/><rect x="46" y="3" width="12" height="6" rx="1.5"/><rect x="62" y="4" width="1.5" height="4" rx=".7" opacity=".45"/>
      </g></svg>
    </div><iframe id="mob"></iframe></div></div>
  <script>
    // One after the other: both frames share localStorage, where the demo sets the theme.
    const desk = document.getElementById("desk"), mob = document.getElementById("mob");
    desk.onload = () => setTimeout(() => { mob.src = "./demo.html?theme=light"; }, 1500);
    desk.src = "./demo.html?view=sound&theme=dark";
  </script>
</body></html>
